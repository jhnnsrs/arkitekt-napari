[project]
name = "arkitekt-napari"
version = "0.35.0"
description = "A plugin for napari to visualize and annotate large 3D images using Arkitekt Next."
authors = [{ name = "jhnnsrs", email = "jhnnsrs@gmail.com" }]
requires-python = ">=3.11,<4"
readme = "README.md"
license = "MIT"
dependencies = [
    "arkitekt[all]>=2",
    "napari"
]
[project.scripts]
arkitekt-napari = "mikro_napari.cli.main:cli"

[tool.uv]
dev-dependencies = [
    "autoflake>=1.7.7,<2",
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.20.2,<0.21",
    "pytest-cov>=4.0.0,<5",
    "pytest-aiohttp>=1.0.4,<2",
    "rich-click>=1.8",
    "mikro-next>=0.19.0",
    "python-semantic-release>=9.21.1",
    "qtpy>=2.4.3",
    "arkitekt-server>=1.7",
    "dokker>=2.2",
    "numpy>=1,<2",
    "rekuest-next>=0.13.1",
    "kabinet>=0.6.0",
    "alpaka>=0.5.0",
    "kraph>=0.5.1",
    "fluss-next>=0.7.0",
    "lovekit>=1.1.0",
    "unlok-next>=1.3.0",
    "reaktion-next>=0.4.1",
]

[tool.hatch.build.targets.sdist]
include = ["arkitekt"]

[tool.hatch.build.targets.wheel]
include = ["arkitekt"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
exclude = ["venv/"]
ignore_missing_imports = true

[tool.ruff]
extend-select = ["ANN", "D1"]
extend-ignore = ["ANN101", "ANN002", "ANN003"]

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 100

[tool.pytest.ini_options]
qt_api = "pyqt5"
markers = [
    "integration: marks tests that require a running server",
    "qt: marks tests that require a running qt application",
    "cli: marks tests that require a running cli",
]

[[tool.pydoc-markdown.loaders]]
type = "python"
search_path = ["arkitekt"]

[tool.pydoc-markdown.renderer]
type = "docusaurus"
docs_base_path = "website/docs"


[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
upload_to_pypi = true
branch = "main"
build_command = "uv build"

